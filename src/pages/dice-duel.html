<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра в кости</title>
</head>
<body class="dice">
    <h1>Игра в кости</h1>
    <main class="container">
        <section class="game">
            <h1 class="game-title">Игра в kubiki</h1>
            <p class="game-description">Бросайте кубики и соревнуйтесь с друзьями! Pobeda za luchim!!</p>
            <div class="dice-container">
                <div class="dice-card">
                    <div class="dice-name">YOU</div>
                    <div class="dicee">⚀</div>
                </div>
                <div class="versus">VS</div>
                <div class="dice-card">
                    <div class="dice-name">COMPUTER</div>
                    <div class="dicee">⚀</div>
                </div>

                <button class="roll-button">Бросить кубики</button>
        </section>
        <aside class="status">
            <h2 class="status-title">Готовы к игре?</h2>
            <div class="score-container">
                <div class="score-item">
                    <div class="score-name">YOU</div>
                    <div class="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-name">COMPUTER</div>
                    <div class="score">0</div>
                </div>
            </div>
            <div class="result">
                <h3 class="history-title">История игр</h3>
                <div class="History">
                    <div class="history-item history-grey"> 3 - 3</div>
                    <div class="history-item history-red"> 2 - 5</div>
                    <div class="history-item history-green"> 5 - 1</div>
                </div>
            </div>   
        </aside>
    </main>
</body>
</html>
